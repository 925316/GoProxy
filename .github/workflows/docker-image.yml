# 专属 CI：构建镜像并推送到本仓库自己的 GHCR（ghcr.io/925316/goproxy）
# - 仅 linux/amd64（CGO 构建，无需 QEMU）
# - 不发布 Docker Hub 等任何第三方 registry
# - 公开包匿名可拉：docker pull ghcr.io/925316/goproxy:latest
#   （首次运行后需在仓库 Packages 设置里把包可见性改为 Public，一次性操作）

name: Build Image (GHCR)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 镜像名必须全小写，仓库名含大写字母时在此规范化
      - name: Compute lowercase image name
        id: img
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
